[project]
name = "fantasy-toolkit"
version = "0.1.0"
description = "Live Sleeper draft assistant with pluggable rankings"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.2",
    "watchfiles>=1.2.0",
]

[project.scripts]
fantasy = "fantasy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fantasy"]
